# evidence; a product shows the note beside the figure.
disputes:
  - gateway: portkey
    publisher: deepseek
    since: "2026-09-10"
    note: Portkey prices DeepSeek from a table that predates DeepSeek's 2026-09-10 price change, at a quarter to a half of the list price.
    source_url: https://api-docs.deepseek.com/updates/
