[project]
name = "metergraph-core"
version = "0.8.0"
description = "Open, effective-dated LLM pricing catalog and deterministic cost calculator for popular models across major providers and gateways, including OpenAI, Anthropic, Google Gemini, AWS Bedrock, OpenRouter, Vercel AI Gateway, and more."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Metergraph" }]
requires-python = ">=3.10"
keywords = [
    "llm",
    "pricing",
    "cost",
    "token-pricing",
    "model-catalog",
    "llm-pricing",
    "model-pricing",
    "token-cost",
    "cost-calculation",
    "openai",
    "anthropic",
    "gemini",
    "bedrock",
    "openrouter",
    "vercel-ai-gateway",
    "finops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/metergraph/metergraph"
Documentation = "https://github.com/metergraph/metergraph/tree/main/core#readme"
Source = "https://github.com/metergraph/metergraph/tree/main/core"
Issues = "https://github.com/metergraph/metergraph/issues"
"Release notes" = "https://github.com/metergraph/metergraph/releases"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metergraph_core = ["data/models.yaml", "data/prices.yaml", "data/sources.yaml"]
